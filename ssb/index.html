<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1526">
<title>Academy Pro Nova Arianto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #0B1526; }
  .splash { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0B1526; transition: opacity 0.35s ease, visibility 0.35s ease; }
  .splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-mark { position: relative; width: 132px; height: 132px; display: flex; align-items: center; justify-content: center; }
  .splash-mark img { width: 100px; height: 100px; border-radius: 50%; }
  .splash-ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 1.1s linear infinite; }
  .splash-ring .track { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 4; }
  .splash-ring .arc { fill: none; stroke: #22C55E; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 90 262; }
  .splash-msg { color: #94A3B8; font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .splash-ring { animation-duration: 3s; } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="splash" class="splash" role="status" aria-live="polite">
  <div class="splash-mark">
    <svg class="splash-ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="56" /><circle class="arc" cx="60" cy="60" r="56" /></svg>
    <img src="icon-192.png" alt="Logo KSG Academy Pro" width="100" height="100">
  </div>
  <div id="splash-msg" class="splash-msg">Memuat data akademi</div>
</div>
<iframe id="app" title="Academy Pro Nova Arianto" allow="clipboard-write"></iframe>
<script src="config.js"></script>
<script>
  document.getElementById('app').src = window.SSB_WEB_APP_URL;
  // Layar pembuka hilang saat aplikasi siap (pesan 'ssb-ready'), dengan batas waktu cadangan.
  function hideSplash() { var sp = document.getElementById('splash'); if (sp) sp.classList.add('done'); }
  setTimeout(function () { var m = document.getElementById('splash-msg'); var sp = document.getElementById('splash'); if (m && sp && !sp.classList.contains('done')) m.textContent = 'Koneksi lambat, tetap memuat...'; }, 8000);
  setTimeout(hideSplash, 25000);
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'ssb-ready') hideSplash();
  });
  // Token notifikasi dari aplikasi (di dalam bingkai Google) diteruskan ke aplikasi Android.
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'ssb-notif') return;
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/\.googleusercontent\.com$/.test(host) && host !== 'script.google.com') return;
    if (window.SSBAndroid && typeof window.SSBAndroid.setNotif === 'function') {
      window.SSBAndroid.setNotif(window.SSB_WEB_APP_URL, d.token || '', d.role || '');
    }
  });
</script>
</body>
</html>
